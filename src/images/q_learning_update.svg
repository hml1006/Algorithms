   </g>
   <g id="text_30">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #06a77d" x="425.7" y="240.192" transform="rotate(-0 425.7 240.192)">γ：折扣因子（未来奖励重要性）</text>
   </g>
   <g id="text_31">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #2e86ab" x="425.7" y="273.456" transform="rotate(-0 425.7 273.456)">max Q(s',a')：下一步最优估计</text>
   </g>
