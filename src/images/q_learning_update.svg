    <text style="font-size: 11px; font-family: 'DejaVu Sans Mono', 'Bitstream Vera Sans Mono', 'Computer Modern Typewriter', 'Andale Mono', 'Nimbus Mono L', 'Courier New', 'Courier', 'Fixed', 'Terminal', monospace; text-anchor: middle" x="425.7" y="129.312" transform="rotate(-0 425.7 129.312)">Q(s,a) ← Q(s,a) + α[r + γ·max Q(s',a') - Q(s,a)]</text>
   </g>
   <g id="text_28">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #f4a261" x="425.7" y="173.664" transform="rotate(-0 425.7 173.664)">α：学习率（新信息占比）</text>
