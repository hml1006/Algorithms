<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="750" height="420">
<rect width="750" height="420" fill="#ffffff" rx="8"/>

<text x="375" y="30" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">线段树 (Segment Tree) — 区间 [1, 8] 的和</text>
<!-- Array at bottom -->
<g transform="translate(0, 340)">
  <rect x="60" y="0" width="40" height="30" rx="3" fill="#e3f2fd" stroke="#2196F3" stroke-width="1"/>
  <text x="80" y="20" font-size="12" fill="#1565C0" text-anchor="middle" font-weight="bold">1</text>
  <rect x="105" y="0" width="40" height="30" rx="3" fill="#e3f2fd" stroke="#2196F3" stroke-width="1"/>
  <text x="125" y="20" font-size="12" fill="#1565C0" text-anchor="middle" font-weight="bold">2</text>
  <rect x="150" y="0" width="40" height="30" rx="3" fill="#e3f2fd" stroke="#2196F3" stroke-width="1"/>
  <text x="170" y="20" font-size="12" fill="#1565C0" text-anchor="middle" font-weight="bold">3</text>
  <rect x="195" y="0" width="40" height="30" rx="3" fill="#e3f2fd" stroke="#2196F3" stroke-width="1"/>
  <text x="215" y="20" font-size="12" fill="#1565C0" text-anchor="middle" font-weight="bold">4</text>
  <rect x="240" y="0" width="40" height="30" rx="3" fill="#e3f2fd" stroke="#2196F3" stroke-width="1"/>
  <text x="260" y="20" font-size="12" fill="#1565C0" text-anchor="middle" font-weight="bold">5</text>
  <rect x="285" y="0" width="40" height="30" rx="3" fill="#e3f2fd" stroke="#2196F3" stroke-width="1"/>
  <text x="305" y="20" font-size="12" fill="#1565C0" text-anchor="middle" font-weight="bold">6</text>
  <rect x="330" y="0" width="40" height="30" rx="3" fill="#e3f2fd" stroke="#2196F3" stroke-width="1"/>
  <text x="350" y="20" font-size="12" fill="#1565C0" text-anchor="middle" font-weight="bold">7</text>
  <rect x="375" y="0" width="40" height="30" rx="3" fill="#e3f2fd" stroke="#2196F3" stroke-width="1"/>
  <text x="395" y="20" font-size="12" fill="#1565C0" text-anchor="middle" font-weight="bold">8</text>
  <text x="220" y="-10" font-size="11" fill="#666" text-anchor="middle">原始数组</text>
</g>
<!-- Tree nodes -->
<!-- Root: [1,8] sum=36 -->
<circle cx="375" cy="80" r="30" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
<text x="375" y="75" font-size="11" fill="#fff" text-anchor="middle">[1,8]</text>
<text x="375" y="90" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">36</text>
<!-- Level 1 -->
<line x1="350" y1="105" x2="220" y2="170" stroke="#888" stroke-width="2"/>
<line x1="400" y1="105" x2="530" y2="170" stroke="#888" stroke-width="2"/>
<circle cx="220" cy="200" r="28" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
<text x="220" y="195" font-size="11" fill="#fff" text-anchor="middle">[1,4]</text>
<text x="220" y="210" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">10</text>
<circle cx="530" cy="200" r="28" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
<text x="530" y="195" font-size="11" fill="#fff" text-anchor="middle">[5,8]</text>
<text x="530" y="210" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">26</text>
<!-- Level 2 -->
<line x1="200" y1="225" x2="130" y2="280" stroke="#888" stroke-width="2"/>
<line x1="240" y1="225" x2="310" y2="280" stroke="#888" stroke-width="2"/>
<line x1="510" y1="225" x2="440" y2="280" stroke="#888" stroke-width="2"/>
<line x1="550" y1="225" x2="620" y2="280" stroke="#888" stroke-width="2"/>
<circle cx="130" cy="305" r="25" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
<text x="130" y="300" font-size="10" fill="#fff" text-anchor="middle">[1,2]</text>
<text x="130" y="315" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<circle cx="310" cy="305" r="25" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
<text x="310" y="300" font-size="10" fill="#fff" text-anchor="middle">[3,4]</text>
<text x="310" y="315" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">7</text>
<circle cx="440" cy="305" r="25" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
<text x="440" y="300" font-size="10" fill="#fff" text-anchor="middle">[5,6]</text>
<text x="440" y="315" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">11</text>
<circle cx="620" cy="305" r="25" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
<text x="620" y="300" font-size="10" fill="#fff" text-anchor="middle">[7,8]</text>
<text x="620" y="315" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">15</text>

<text x="375" y="410" font-size="12" fill="#666" text-anchor="middle">查询 [3,6] 的和 = [3,4] + [5,6] = 7 + 11 = 18 · 建树 O(n) · 查询/更新 O(log n)</text>
</svg>