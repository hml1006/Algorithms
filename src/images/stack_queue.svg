<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
<rect width="800" height="400" fill="#ffffff" rx="8"/>

<text x="200" y="35" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">栈 (Stack) — LIFO</text>
<text x="600" y="35" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">队列 (Queue) — FIFO</text>
<!-- Stack container -->
<rect x="100" y="50" width="200" height="280" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>
<text x="200" y="75" font-size="11" fill="#999" text-anchor="middle">Top</text>
<!-- Stack elements -->
<rect x="120" y="80" width="160" height="40" rx="3" fill="#FF9800" stroke="#E65100" stroke-width="1.5"/>
<text x="200" y="105" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">push(5)  ← 入栈</text>
<rect x="120" y="125" width="160" height="40" rx="3" fill="#FFA726" stroke="#E65100" stroke-width="1.5"/>
<text x="200" y="150" font-size="14" fill="#fff" text-anchor="middle">push(3)</text>
<rect x="120" y="170" width="160" height="40" rx="3" fill="#FFB74D" stroke="#E65100" stroke-width="1.5"/>
<text x="200" y="195" font-size="14" fill="#fff" text-anchor="middle">push(8)</text>
<rect x="120" y="215" width="160" height="40" rx="3" fill="#FFCC80" stroke="#E65100" stroke-width="1.5"/>
<text x="200" y="240" font-size="14" fill="#fff" text-anchor="middle">push(1)</text>
<text x="200" y="350" font-size="12" fill="#999" text-anchor="middle">pop() → 弹出 5（栈顶）</text>

<!-- Queue container -->
<rect x="500" y="50" width="250" height="280" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>
<text x="500" y="75" font-size="11" fill="#999" text-anchor="start">Front</text>
<text x="750" y="75" font-size="11" fill="#999" text-anchor="end">Rear</text>
<!-- Queue elements -->
<rect x="510" y="80" width="55" height="40" rx="3" fill="#4CAF50" stroke="#2E7D32" stroke-width="1.5"/>
<text x="537" y="105" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<rect x="570" y="80" width="55" height="40" rx="3" fill="#66BB6A" stroke="#2E7D32" stroke-width="1.5"/>
<text x="597" y="105" font-size="14" fill="#fff" text-anchor="middle">2</text>
<rect x="630" y="80" width="55" height="40" rx="3" fill="#81C784" stroke="#2E7D32" stroke-width="1.5"/>
<text x="657" y="105" font-size="14" fill="#fff" text-anchor="middle">3</text>
<rect x="690" y="80" width="55" height="40" rx="3" fill="#A5D6A7" stroke="#2E7D32" stroke-width="1.5"/>
<text x="717" y="105" font-size="14" fill="#fff" text-anchor="middle">4</text>
<!-- Dequeue arrow -->
<path d="M510,130 L510,220 L520,220" fill="none" stroke="#f44336" stroke-width="2" marker-end="url(#arrow2)"/>
<text x="500" y="240" font-size="12" fill="#f44336" text-anchor="end">dequeue() → 1</text>
<!-- Enqueue arrow -->
<path d="M760,130 L760,220 L750,220" fill="none" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrow2)"/>
<text x="770" y="240" font-size="12" fill="#4CAF50" text-anchor="start">enqueue(5) → 5</text>

<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker>
</defs>
<text x="400" y="380" font-size="12" fill="#999" text-anchor="middle">栈：后进先出 · 队列：先进先出</text>
</svg>