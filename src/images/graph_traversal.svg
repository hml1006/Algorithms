<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400" width="750" height="400">
<rect width="750" height="400" fill="#ffffff" rx="8"/>

<text x="375" y="30" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">图的遍历: BFS vs DFS</text>
<!-- Graph -->
<circle cx="150" cy="120" r="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
<text x="150" y="125" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<circle cx="300" cy="80" r="25" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
<text x="300" y="85" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<circle cx="300" cy="200" r="25" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
<text x="300" y="205" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<circle cx="450" cy="80" r="25" fill="#9C27B0" stroke="#6A1B9A" stroke-width="2"/>
<text x="450" y="85" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
<circle cx="450" cy="200" r="25" fill="#E91E63" stroke="#AD1457" stroke-width="2"/>
<text x="450" y="205" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
<circle cx="600" cy="140" r="25" fill="#00BCD4" stroke="#00838F" stroke-width="2"/>
<text x="600" y="145" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">6</text>

<!-- Edges -->
<line x1="175" y1="120" x2="275" y2="90" stroke="#888" stroke-width="2"/>
<line x1="175" y1="130" x2="275" y2="190" stroke="#888" stroke-width="2"/>
<line x1="325" y1="90" x2="425" y2="90" stroke="#888" stroke-width="2"/>
<line x1="325" y1="190" x2="425" y2="190" stroke="#888" stroke-width="2"/>
<line x1="325" y1="95" x2="325" y2="185" stroke="#888" stroke-width="2"/>
<line x1="475" y1="95" x2="575" y2="135" stroke="#888" stroke-width="2"/>
<line x1="475" y1="190" x2="575" y2="145" stroke="#888" stroke-width="2"/>

<!-- BFS order -->
<text x="375" y="280" font-size="14" font-weight="bold" fill="#4CAF50" text-anchor="middle">BFS (广度优先): 1 → 2 → 3 → 4 → 5 → 6</text>
<text x="375" y="300" font-size="12" fill="#666" text-anchor="middle">使用队列 · 逐层遍历 · 无权图最短路径</text>

<!-- DFS order -->
<text x="375" y="335" font-size="14" font-weight="bold" fill="#2196F3" text-anchor="middle">DFS (深度优先): 1 → 2 → 4 → 6 → 5 → 3</text>
<text x="375" y="355" font-size="12" fill="#666" text-anchor="middle">使用栈(递归) · 深入回溯 · 连通性检测</text>
<text x="375" y="380" font-size="12" fill="#999" text-anchor="middle">时间复杂度: O(V+E) · 空间复杂度: O(V)</text>
</svg>