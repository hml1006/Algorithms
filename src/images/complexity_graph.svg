<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="#ffffff" rx="8"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker>
</defs>
<!-- Axes -->
<line x1="60" y1="440" x2="760" y2="440" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="60" y1="440" x2="60" y2="40" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<text x="750" y="460" font-size="14" fill="#555" text-anchor="end">n (输入规模)</text>
<text x="40" y="45" font-size="14" fill="#555" text-anchor="middle" transform="rotate(-90,40,45)">时间</text>
<!-- Grid lines -->
<line x1="60" y1="340" x2="760" y2="340" stroke="#eee" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="60" y1="240" x2="760" y2="240" stroke="#eee" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="60" y1="140" x2="760" y2="140" stroke="#eee" stroke-width="1" stroke-dasharray="4,4"/>
<!-- O(1) -->
<line x1="60" y1="350" x2="760" y2="350" stroke="#4CAF50" stroke-width="3"/>
<text x="770" y="355" font-size="13" fill="#4CAF50">O(1) — 常数</text>
<!-- O(log n) -->
<path d="M60,430 Q200,410 350,395 Q500,370 600,350 Q700,320 760,295" fill="none" stroke="#2196F3" stroke-width="3"/>
<text x="770" y="300" font-size="13" fill="#2196F3">O(log n) — 对数</text>
<!-- O(n) -->
<line x1="60" y1="430" x2="760" y2="240" stroke="#FF9800" stroke-width="3"/>
<text x="770" y="245" font-size="13" fill="#FF9800">O(n) — 线性</text>
<!-- O(n log n) -->
<path d="M60,435 Q200,410 350,380 Q500,320 600,280 Q700,210 760,150" fill="none" stroke="#9C27B0" stroke-width="3"/>
<text x="770" y="155" font-size="13" fill="#9C27B0">O(n log n) — 线性对数</text>
<!-- O(n²) -->
<path d="M60,435 Q100,430 200,420 Q350,390 500,320 Q600,260 700,170 Q730,140 760,100" fill="none" stroke="#f44336" stroke-width="3"/>
<text x="770" y="105" font-size="13" fill="#f44336">O(n²) — 平方</text>
<!-- O(2ⁿ) -->
<path d="M60,440 Q100,438 150,430 Q200,410 250,380 Q280,340 300,290 Q310,240 320,180 Q325,120 330,50" fill="none" stroke="#E91E63" stroke-width="3"/>
<text x="770" y="55" font-size="13" fill="#E91E63">O(2ⁿ) — 指数</text>
<!-- Labels -->
<text x="60" y="455" font-size="11" fill="#999" text-anchor="middle">0</text>
<text x="200" y="455" font-size="11" fill="#999" text-anchor="middle">10</text>
<text x="380" y="455" font-size="11" fill="#999" text-anchor="middle">50</text>
<text x="560" y="455" font-size="11" fill="#999" text-anchor="middle">100</text>
<text x="740" y="455" font-size="11" fill="#999" text-anchor="middle">200</text>
<text x="50" y="440" font-size="11" fill="#999" text-anchor="end">0</text>
<text x="50" y="340" font-size="11" fill="#999" text-anchor="end">100</text>
<text x="50" y="240" font-size="11" fill="#999" text-anchor="end">200</text>
<text x="50" y="140" font-size="11" fill="#999" text-anchor="end">300</text>
</svg>