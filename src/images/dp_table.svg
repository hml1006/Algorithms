<text x="375" y="330" font-size="13" fill="#666" text-anchor="middle">DP 公式: dp[i][j] = dp[i-1][j-1] + 1 (if s1[i]==s2[j])</text>
<text x="375" y="350" font-size="13" fill="#666" text-anchor="middle">          max(dp[i-1][j], dp[i][j-1]) (otherwise)</text>
<text x="375" y="380" font-size="14" fill="#f44336" font-weight="bold" text-anchor="middle">LCS = "ace" · 长度 = 3</text>
