<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 350" width="750" height="350">
<rect width="750" height="350" fill="#ffffff" rx="8"/>

<text x="375" y="30" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">并查集 (Disjoint Set Union)</text>
<text x="375" y="55" font-size="13" fill="#666" text-anchor="middle">初始: 每个元素独立 · 合并: union(1,2), union(3,4), union(1,3)</text>
<!-- Set 1: {1,2,3,4} -->
<text x="200" y="90" font-size="14" font-weight="bold" fill="#4CAF50" text-anchor="middle">集合 A = {1, 2, 3, 4}</text>
<!-- Root: 1 -->
<circle cx="200" cy="140" r="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
<text x="200" y="145" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="200" y="175" font-size="10" fill="#4CAF50" text-anchor="middle">根节点</text>
<!-- Children: 2, 3 -->
<line x1="185" y1="160" x2="130" y2="220" stroke="#4CAF50" stroke-width="2"/>
<line x1="215" y1="160" x2="270" y2="220" stroke="#4CAF50" stroke-width="2"/>
<circle cx="130" cy="250" r="22" fill="#c8e6c9" stroke="#4CAF50" stroke-width="2"/>
<text x="130" y="255" font-size="15" fill="#2E7D32" text-anchor="middle" font-weight="bold">2</text>
<circle cx="270" cy="250" r="22" fill="#c8e6c9" stroke="#4CAF50" stroke-width="2"/>
<text x="270" y="255" font-size="15" fill="#2E7D32" text-anchor="middle" font-weight="bold">3</text>
<!-- Child of 3: 4 -->
<line x1="280" y1="268" x2="320" y2="310" stroke="#4CAF50" stroke-width="2"/>
<circle cx="320" cy="325" r="22" fill="#c8e6c9" stroke="#4CAF50" stroke-width="2"/>
<text x="320" y="330" font-size="15" fill="#2E7D32" text-anchor="middle" font-weight="bold">4</text>

<!-- Set 2: {5,6} -->
<text x="600" y="90" font-size="14" font-weight="bold" fill="#FF9800" text-anchor="middle">集合 B = {5, 6}</text>
<circle cx="600" cy="140" r="25" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
<text x="600" y="145" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
<text x="600" y="175" font-size="10" fill="#FF9800" text-anchor="middle">根节点</text>
<line x1="610" y1="160" x2="640" y2="220" stroke="#FF9800" stroke-width="2"/>
<circle cx="640" cy="250" r="22" fill="#fff3e0" stroke="#FF9800" stroke-width="2"/>
<text x="640" y="255" font-size="15" fill="#E65100" text-anchor="middle" font-weight="bold">6</text>

<!-- Operations -->
<text x="375" y="300" font-size="13" fill="#666" text-anchor="middle">find(4) → 1 · find(6) → 5 · union(1,5) → 合并为一个大集合</text>
<text x="375" y="325" font-size="12" fill="#999" text-anchor="middle">路径压缩 + 按秩合并 → 近似 O(1) 操作</text>
</svg>