<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <style>
    text { font-family: sans-serif; font-size: 13px; fill: #333; }
    .label { font-size: 14px; font-weight: bold; }
    .arrow { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">珂朵莉树 (ODT) — 区间涂色操作</text>

  <!-- === 初始状态 === -->
  <text x="30" y="60" class="label" fill="#555">初始状态：</text>

  <!-- 初始格子：不同颜色 -->
  <rect x="30" y="70" width="40" height="40" rx="3" fill="#4A90D9"/>
  <rect x="70" y="70" width="40" height="40" rx="3" fill="#4A90D9"/>
  <rect x="110" y="70" width="40" height="40" rx="3" fill="#7B68EE"/>
  <rect x="150" y="70" width="40" height="40" rx="3" fill="#E74C3C"/>
  <rect x="190" y="70" width="40" height="40" rx="3" fill="#E74C3C"/>
  <rect x="230" y="70" width="40" height="40" rx="3" fill="#E74C3C"/>
  <rect x="270" y="70" width="40" height="40" rx="3" fill="#2ECC71"/>
  <rect x="310" y="70" width="40" height="40" rx="3" fill="#2ECC71"/>
  <rect x="350" y="70" width="40" height="40" rx="3" fill="#F39C12"/>
  <rect x="390" y="70" width="40" height="40" rx="3" fill="#F39C12"/>
  <rect x="430" y="70" width="40" height="40" rx="3" fill="#F39C12"/>
  <rect x="470" y="70" width="40" height="40" rx="3" fill="#4A90D9"/>

  <!-- 下标 -->
  <text x="50" y="125" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="90" y="125" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="130" y="125" text-anchor="middle" font-size="11" fill="#999">3</text>
  <text x="170" y="125" text-anchor="middle" font-size="11" fill="#999">4</text>
  <text x="210" y="125" text-anchor="middle" font-size="11" fill="#999">5</text>
  <text x="250" y="125" text-anchor="middle" font-size="11" fill="#999">6</text>
  <text x="290" y="125" text-anchor="middle" font-size="11" fill="#999">7</text>
  <text x="330" y="125" text-anchor="middle" font-size="11" fill="#999">8</text>
  <text x="370" y="125" text-anchor="middle" font-size="11" fill="#999">9</text>
  <text x="410" y="125" text-anchor="middle" font-size="11" fill="#999">10</text>
  <text x="450" y="125" text-anchor="middle" font-size="11" fill="#999">11</text>
  <text x="490" y="125" text-anchor="middle" font-size="11" fill="#999">12</text>

  <!-- 区间表示 -->
  <text x="30" y="155" font-size="12" fill="#777">区间表示：</text>
  <text x="110" y="155" font-size="12" fill="#4A90D9">[1,2]蓝</text>
  <text x="180" y="155" font-size="12" fill="#7B68EE">[3,3]紫</text>
  <text x="250" y="155" font-size="12" fill="#E74C3C">[4,6]红</text>
  <text x="320" y="155" font-size="12" fill="#2ECC71">[7,8]绿</text>
  <text x="390" y="155" font-size="12" fill="#F39C12">[9,11]橙</text>
  <text x="460" y="155" font-size="12" fill="#4A90D9">[12,12]蓝</text>

  <!-- 箭头：操作 -->
  <line x1="400" y1="170" x2="400" y2="200" class="arrow"/>
  <rect x="250" y="185" width="300" height="28" rx="5" fill="#FFF3CD" stroke="#FFC107" stroke-width="1"/>
  <text x="400" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">操作：区间涂色 assign(3, 8, 紫)</text>

  <!-- === 操作后状态 === -->
  <text x="30" y="240" class="label" fill="#555">操作后：</text>

  <!-- 操作后格子 -->
  <rect x="30" y="250" width="40" height="40" rx="3" fill="#4A90D9"/>
  <rect x="70" y="250" width="40" height="40" rx="3" fill="#4A90D9"/>
  <rect x="110" y="250" width="40" height="40" rx="3" fill="#7B68EE"/>
  <rect x="150" y="250" width="40" height="40" rx="3" fill="#7B68EE"/>
  <rect x="190" y="250" width="40" height="40" rx="3" fill="#7B68EE"/>
  <rect x="230" y="250" width="40" height="40" rx="3" fill="#7B68EE"/>
  <rect x="270" y="250" width="40" height="40" rx="3" fill="#7B68EE"/>
  <rect x="310" y="250" width="40" height="40" rx="3" fill="#7B68EE"/>
  <rect x="350" y="250" width="40" height="40" rx="3" fill="#F39C12"/>
  <rect x="390" y="250" width="40" height="40" rx="3" fill="#F39C12"/>
  <rect x="430" y="250" width="40" height="40" rx="3" fill="#F39C12"/>
  <rect x="470" y="250" width="40" height="40" rx="3" fill="#4A90D9"/>

  <!-- 高亮被修改的区间 -->
  <rect x="110" y="250" width="240" height="40" rx="3" fill="none" stroke="#FF6B6B" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- 下标 -->
  <text x="50" y="305" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="90" y="305" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="130" y="305" text-anchor="middle" font-size="11" fill="#999">3</text>
  <text x="170" y="305" text-anchor="middle" font-size="11" fill="#999">4</text>
  <text x="210" y="305" text-anchor="middle" font-size="11" fill="#999">5</text>
  <text x="250" y="305" text-anchor="middle" font-size="11" fill="#999">6</text>
  <text x="290" y="305" text-anchor="middle" font-size="11" fill="#999">7</text>
  <text x="330" y="305" text-anchor="middle" font-size="11" fill="#999">8</text>
  <text x="370" y="305" text-anchor="middle" font-size="11" fill="#999">9</text>
  <text x="410" y="305" text-anchor="middle" font-size="11" fill="#999">10</text>
  <text x="450" y="305" text-anchor="middle" font-size="11" fill="#999">11</text>
  <text x="490" y="305" text-anchor="middle" font-size="11" fill="#999">12</text>

  <!-- 合并后的区间表示 -->
  <text x="30" y="335" font-size="12" fill="#777">合并后区间：</text>
  <text x="120" y="335" font-size="12" fill="#4A90D9">[1,2]蓝</text>
  <text x="190" y="335" font-size="12" fill="#7B68EE">[3,8]紫</text>
  <text x="280" y="335" font-size="12" fill="#F39C12">[9,11]橙</text>
  <text x="360" y="335" font-size="12" fill="#4A90D9">[12,12]蓝</text>
</svg>