<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
<rect width="700" height="500" fill="#ffffff" rx="8"/>

<text x="350" y="30" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">算法学习天梯图</text>
<!-- Ladder steps -->
<g>
  <!-- Step 10: OI/ACM Advanced -->
  <rect x="200" y="50" width="350" height="35" rx="5" fill="#E91E63" stroke="#AD1457" stroke-width="2"/>
  <text x="375" y="72" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">第10层: OI/ACM 竞赛高级专题</text>
  <text x="560" y="72" font-size="10" fill="#ccc" text-anchor="start">LCT · 莫队 · 多项式</text>

  <!-- Step 9: Advanced -->
  <rect x="180" y="95" width="370" height="35" rx="5" fill="#9C27B0" stroke="#6A1B9A" stroke-width="2"/>
  <text x="375" y="117" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">第9层: 高级算法与复杂度理论</text>
  <text x="560" y="117" font-size="10" fill="#ccc" text-anchor="start">P/NP · 随机化 · 近似</text>

  <!-- Step 8: Number Theory -->
  <rect x="160" y="140" width="390" height="35" rx="5" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
  <text x="375" y="162" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">第8层: 数论与组合数学</text>
  <text x="560" y="162" font-size="10" fill="#ccc" text-anchor="start">GCD · 筛法 · 快速幂</text>

  <!-- Step 7: Computational Geometry -->
  <rect x="140" y="185" width="410" height="35" rx="5" fill="#795548" stroke="#4E342E" stroke-width="2"/>
  <text x="375" y="207" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">第7层: 计算几何</text>
  <text x="560" y="207" font-size="10" fill="#ccc" text-anchor="start">凸包 · 半平面交</text>

  <!-- Step 6: String -->
  <rect x="120" y="230" width="430" height="35" rx="5" fill="#00BCD4" stroke="#00838F" stroke-width="2"/>
  <text x="375" y="252" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">第6层: 字符串算法</text>
  <text x="560" y="252" font-size="10" fill="#ccc" text-anchor="start">KMP · 后缀数组 · SAM</text>

  <!-- Step 5: DP -->
  <rect x="100" y="275" width="450" height="35" rx="5" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  <text x="375" y="297" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">第5层: 动态规划</text>
  <text x="560" y="297" font-size="10" fill="#ccc" text-anchor="start">背包 · LCS · 区间DP</text>

  <!-- Step 4: Graph -->
  <rect x="80" y="320" width="470" height="35" rx="5" fill="#2196F3" stroke="#1565C0" stroke-width="2"/>
  <text x="375" y="342" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">第4层: 图论算法</text>
  <text x="560" y="342" font-size="10" fill="#ccc" text-anchor="start">Dijkstra · 网络流 · 并查集</text>

  <!-- Step 3: Advanced Data Structures -->
  <rect x="60" y="365" width="490" height="35" rx="5" fill="#FF5722" stroke="#BF360C" stroke-width="2"/>
  <text x="375" y="387" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">第3层: 进阶数据结构</text>
  <text x="560" y="387" font-size="10" fill="#ccc" text-anchor="start">线段树 · 树状数组 · Trie</text>

  <!-- Step 2: Sorting &amp; Searching -->
  <rect x="40" y="410" width="510" height="35" rx="5" fill="#3F51B5" stroke="#283593" stroke-width="2"/>
  <text x="375" y="432" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">第2层: 排序与搜索算法</text>
  <text x="560" y="432" font-size="10" fill="#ccc" text-anchor="start">快排 · 归并 · BFS · DFS</text>

  <!-- Step 1: Foundation -->
  <rect x="20" y="455" width="530" height="35" rx="5" fill="#607D8B" stroke="#37474F" stroke-width="2"/>
  <text x="375" y="477" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">第1层: 基础数据结构 &amp; 基础算法</text>
  <text x="560" y="477" font-size="10" fill="#ccc" text-anchor="start">数组 · 链表 · 栈 · 队列</text>
</g>
</svg>