<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
<rect width="700" height="400" fill="#ffffff" rx="8"/>

<text x="350" y="30" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">字典树 (Trie) — 包含单词: cat, car, dog</text>
<!-- Root -->
<circle cx="350" cy="80" r="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
<text x="350" y="85" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">root</text>
<!-- Edges root→c, root→d -->
<line x1="330" y1="100" x2="220" y2="180" stroke="#888" stroke-width="2"/>
<text x="280" y="140" font-size="14" fill="#E65100" text-anchor="middle" font-weight="bold">c</text>
<line x1="370" y1="100" x2="480" y2="180" stroke="#888" stroke-width="2"/>
<text x="420" y="140" font-size="14" fill="#E65100" text-anchor="middle" font-weight="bold">d</text>
<!-- C node -->
<circle cx="220" cy="210" r="25" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
<text x="220" y="215" font-size="15" fill="#1565C0" text-anchor="middle" font-weight="bold">c</text>
<!-- D node -->
<circle cx="480" cy="210" r="25" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
<text x="480" y="215" font-size="15" fill="#1565C0" text-anchor="middle" font-weight="bold">d</text>
<!-- Edges c→a -->
<line x1="205" y1="232" x2="150" y2="300" stroke="#888" stroke-width="2"/>
<text x="180" y="265" font-size="14" fill="#E65100" text-anchor="middle" font-weight="bold">a</text>
<!-- A node -->
<circle cx="150" cy="330" r="25" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
<text x="150" y="335" font-size="15" fill="#1565C0" text-anchor="middle" font-weight="bold">a</text>
<!-- Edges a→t, a→r -->
<line x1="135" y1="352" x2="90" y2="390" stroke="#888" stroke-width="2"/>
<text x="115" y="375" font-size="12" fill="#E65100" text-anchor="middle" font-weight="bold">t</text>
<line x1="165" y1="352" x2="210" y2="390" stroke="#888" stroke-width="2"/>
<text x="185" y="375" font-size="12" fill="#E65100" text-anchor="middle" font-weight="bold">r</text>
<!-- T node -->
<circle cx="90" cy="390" r="18" fill="#c8e6c9" stroke="#4CAF50" stroke-width="2"/>
<text x="90" y="395" font-size="13" fill="#2E7D32" text-anchor="middle" font-weight="bold">t</text>
<text x="90" y="415" font-size="10" fill="#4CAF50" text-anchor="middle" font-weight="bold">$</text>
<!-- R node -->
<circle cx="210" cy="390" r="18" fill="#c8e6c9" stroke="#4CAF50" stroke-width="2"/>
<text x="210" y="395" font-size="13" fill="#2E7D32" text-anchor="middle" font-weight="bold">r</text>
<text x="210" y="415" font-size="10" fill="#4CAF50" text-anchor="middle" font-weight="bold">$</text>
<!-- Edges d→o -->
<line x1="465" y1="232" x2="430" y2="300" stroke="#888" stroke-width="2"/>
<text x="450" y="265" font-size="14" fill="#E65100" text-anchor="middle" font-weight="bold">o</text>
<!-- O node -->
<circle cx="430" cy="330" r="25" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
<text x="430" y="335" font-size="15" fill="#1565C0" text-anchor="middle" font-weight="bold">o</text>
<!-- Edge o→g -->
<line x1="440" y1="352" x2="490" y2="390" stroke="#888" stroke-width="2"/>
<text x="460" y="375" font-size="12" fill="#E65100" text-anchor="middle" font-weight="bold">g</text>
<!-- G node -->
<circle cx="490" cy="390" r="18" fill="#c8e6c9" stroke="#4CAF50" stroke-width="2"/>
<text x="490" y="395" font-size="13" fill="#2E7D32" text-anchor="middle" font-weight="bold">g</text>
<text x="490" y="415" font-size="10" fill="#4CAF50" text-anchor="middle" font-weight="bold">$</text>
<!-- Search path highlight -->
<path d="M350,105 L280,140 L220,180" fill="none" stroke="#f44336" stroke-width="2" stroke-dasharray="5,3"/>
<text x="350" y="130" font-size="12" fill="#f44336" font-weight="bold" text-anchor="start">搜索 "cat": root → c → a → t ✓</text>
</svg>