   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; text-anchor: middle" x="392.4" y="40.686452" transform="rotate(-0 392.4 40.686452)">exLucas：组合数取模（模数非质数）的流程</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif" transform="translate(334.254687 63.974672)">目标：求 C(n,m) mod p</text>
    <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif" transform="translate(354.757656 80.562329)">（p 不是质数）</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif" transform="translate(103.935656 126.459032)">① 质因数分解</text>
    <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif" transform="translate(92.681281 142.134032)">p = 2^2 * 5 (例: 20)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif" transform="translate(335.473281 125.671845)">② 任一质数幂 pk = q^k</text>
    <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif" transform="translate(342.089609 142.029189)">q 为质数，gk = p/pk</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif" transform="translate(592.488797 125.671845)">③ 对每个 pk 单独计算</text>
    <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif" transform="translate(608.682859 142.018017)">C(n,m) mod pk</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; text-anchor: middle" x="138.168" y="215.987371" transform="rotate(-0 138.168 215.987371)">pk=2^2  -&gt;  r1 = C(n,m) mod 4</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; text-anchor: middle" x="392.4" y="215.987371" transform="rotate(-0 392.4 215.987371)">pk=5^1  -&gt;  r2 = C(n,m) mod 5</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif" transform="translate(341.221641 277.21686)">④ 中国剩余定理 CRT</text>
    <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif" transform="translate(333.373828 292.879829)">用 (r1, r2) 反解出 mod p</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; text-anchor: middle" x="392.4" y="358.284667" transform="rotate(-0 392.4 358.284667)">唯一解：C(n,m) mod p</text>
   </g>
   <g id="text_10">
