    <text style="font-size: 9px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; fill: #155724" transform="translate(532.939359 275.193735)">CRT：不同质数幂模数</text>
    <text style="font-size: 9px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; fill: #155724" transform="translate(532.296 284.193735)">彼此互质，可唯一还原</text>
    <text style="font-size: 9px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; fill: #155724" transform="translate(553.806 293.193735)">mod p 的解</text>
   </g>
