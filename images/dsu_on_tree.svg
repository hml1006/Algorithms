   <g id="text_8">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; fill: #374151" transform="translate(97.020312 246.772625)">先处理轻儿子并清空统计，再处理重儿子(红)并保留其统计，</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; fill: #374151" transform="translate(97.388281 257.532)">最后把轻儿子子树合并进来 → 每个节点只被合并 O(log n) 次</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'Noto Sans CJK SC', 'DejaVu Sans', sans-serif; text-anchor: middle" x="230.4" y="17.76" transform="rotate(-0 230.4 17.76)">DSU on Tree：保留重儿子统计，轻儿子合并进来，总 O(n log n)</text>
