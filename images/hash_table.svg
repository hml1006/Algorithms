<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400" width="750" height="400">
<rect width="750" height="400" fill="#ffffff" rx="8"/>

<text x="375" y="30" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">哈希表 — 链地址法 (Chaining)</text>
<!-- Bucket array -->
<rect x="30" y="50" width="200" height="300" rx="5" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>
<text x="130" y="75" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">哈希桶 (Buckets)</text>
<!-- Index labels -->
<text x="20" y="105" font-size="11" fill="#999" text-anchor="end">0</text>
<text x="20" y="145" font-size="11" fill="#999" text-anchor="end">1</text>
<text x="20" y="185" font-size="11" fill="#999" text-anchor="end">2</text>
<text x="20" y="225" font-size="11" fill="#999" text-anchor="end">3</text>
<text x="20" y="265" font-size="11" fill="#999" text-anchor="end">4</text>
<text x="20" y="305" font-size="11" fill="#999" text-anchor="end">5</text>
<text x="20" y="345" font-size="11" fill="#999" text-anchor="end">6</text>
<!-- Bucket rows -->
<rect x="30" y="92" width="200" height="40" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
<rect x="30" y="132" width="200" height="40" fill="#fff" stroke="#ccc" stroke-width="1"/>
<rect x="30" y="172" width="200" height="40" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
<rect x="30" y="212" width="200" height="40" fill="#fff" stroke="#ccc" stroke-width="1"/>
<rect x="30" y="252" width="200" height="40" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
<rect x="30" y="292" width="200" height="40" fill="#fff" stroke="#ccc" stroke-width="1"/>
<rect x="30" y="332" width="200" height="40" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
<!-- Bucket 2 has data -->
<rect x="35" y="177" width="190" height="30" rx="3" fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>
<text x="130" y="197" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">hash("apple") = 2</text>
<!-- Bucket 5 has data -->
<rect x="35" y="297" width="190" height="30" rx="3" fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>
<text x="130" y="317" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">hash("banana") = 5</text>
<!-- Chain from bucket 2 -->
<defs>
  <marker id="arrow3" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#888"/></marker>
</defs>
<line x1="230" y1="192" x2="275" y2="192" stroke="#888" stroke-width="1.5" marker-end="url(#arrow3)"/>
<!-- Chain node 1 -->
<rect x="280" y="170" width="120" height="45" rx="5" fill="#fff3e0" stroke="#FF9800" stroke-width="2"/>
<text x="340" y="190" font-size="12" fill="#E65100" text-anchor="middle" font-weight="bold">key="apple"</text>
<text x="340" y="205" font-size="11" fill="#888" text-anchor="middle">value="水果"</text>
<line x1="400" y1="192" x2="425" y2="192" stroke="#888" stroke-width="1.5" marker-end="url(#arrow3)"/>
<!-- Chain node 2 -->
<rect x="430" y="170" width="120" height="45" rx="5" fill="#fff3e0" stroke="#FF9800" stroke-width="2"/>
<text x="490" y="190" font-size="12" fill="#E65100" text-anchor="middle" font-weight="bold">key="apply"</text>
<text x="490" y="205" font-size="11" fill="#888" text-anchor="middle">value="应用"</text>
<line x1="550" y1="192" x2="575" y2="192" stroke="#888" stroke-width="1.5" marker-end="url(#arrow3)"/>
<!-- Chain node 3 -->
<rect x="580" y="170" width="120" height="45" rx="5" fill="#fff3e0" stroke="#FF9800" stroke-width="2"/>
<text x="640" y="190" font-size="12" fill="#E65100" text-anchor="middle" font-weight="bold">key="ape"</text>
<text x="640" y="205" font-size="11" fill="#888" text-anchor="middle">value="猿"</text>
<text x="640" y="225" font-size="11" fill="#999" text-anchor="middle">→ NULL</text>
<!-- Hash function description -->
<text x="375" y="380" font-size="12" fill="#666" text-anchor="middle">哈希函数: key → hash(key) % 7 · 冲突时用链表链接 · 平均 O(1) 查找</text>
</svg>