    <text style="font-size: 10px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #6c757d" x="425.7" y="267.032" transform="rotate(-0 425.7 267.032)">把所有堆的数量异或，结果为 0 → 必败；非 0 → 必胜</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #6c757d" x="314.1" y="322.472" transform="rotate(-0 314.1 322.472)">SG 函数推广：每堆视为独立子游戏，SG 值异或</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Noto Sans CJK SC'; text-anchor: middle" x="314.1" y="18.64" transform="rotate(-0 314.1 18.64)">Nim 游戏：三堆石头，轮流取，取走最后一颗者胜</text>
   </g>
