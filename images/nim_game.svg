   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #2e86ab" x="63" y="210.228" transform="rotate(-0 63 210.228)">堆2: 4</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: middle; fill: #06a77d" x="63" y="282.3" transform="rotate(-0 63 282.3)">堆3: 5</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #2e86ab" x="425.7" y="100.712" transform="rotate(-0 425.7 100.712)">Nim 和 = 3 ⊕ 4 ⊕ 5</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans Mono', 'Bitstream Vera Sans Mono', 'Computer Modern Typewriter', 'Andale Mono', 'Nimbus Mono L', 'Courier New', 'Courier', 'Fixed', 'Terminal', monospace; text-anchor: start" x="425.7" y="139.52" transform="rotate(-0 425.7 139.52)">= (011) ⊕ (100) ⊕ (101) = 010 = 2</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #e63946" x="425.7" y="183.872" transform="rotate(-0 425.7 183.872)">Nim 和 = 2 ≠ 0</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK SC'; text-anchor: start; fill: #06a77d" x="425.7" y="222.68" transform="rotate(-0 425.7 222.68)">先手必胜（可走到 Nim 和 = 0）</text>
   </g>
   <g id="text_8">
