<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
<rect width="800" height="200" fill="#ffffff" rx="8"/>

<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2196F3"/></marker>
</defs>
<text x="400" y="30" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">单向链表 (Singly Linked List)</text>
<!-- Head -->
<rect x="40" y="60" width="60" height="40" rx="5" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
<text x="70" y="85" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Head</text>
<!-- Arrow head→node1 -->
<line x1="100" y1="80" x2="140" y2="80" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow2)"/>
<!-- Node 1 -->
<rect x="140" y="55" width="40" height="50" rx="3" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
<text x="160" y="85" font-size="16" fill="#1565C0" text-anchor="middle" font-weight="bold">3</text>
<line x1="180" y1="55" x2="180" y2="105" stroke="#2196F3" stroke-width="2"/>
<text x="195" y="85" font-size="12" fill="#666" text-anchor="middle">→</text>
<!-- Arrow node1→node2 -->
<line x1="210" y1="80" x2="240" y2="80" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow2)"/>
<!-- Node 2 -->
<rect x="240" y="55" width="40" height="50" rx="3" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
<text x="260" y="85" font-size="16" fill="#1565C0" text-anchor="middle" font-weight="bold">7</text>
<line x1="280" y1="55" x2="280" y2="105" stroke="#2196F3" stroke-width="2"/>
<text x="295" y="85" font-size="12" fill="#666" text-anchor="middle">→</text>
<!-- Arrow node2→node3 -->
<line x1="310" y1="80" x2="340" y2="80" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow2)"/>
<!-- Node 3 -->
<rect x="340" y="55" width="40" height="50" rx="3" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
<text x="360" y="85" font-size="16" fill="#1565C0" text-anchor="middle" font-weight="bold">1</text>
<line x1="380" y1="55" x2="380" y2="105" stroke="#2196F3" stroke-width="2"/>
<text x="395" y="85" font-size="12" fill="#666" text-anchor="middle">→</text>
<!-- Arrow node3→null -->
<line x1="410" y1="80" x2="450" y2="80" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow2)"/>
<rect x="450" y="60" width="50" height="40" rx="5" fill="#bbb" stroke="#999" stroke-width="2"/>
<text x="475" y="85" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">NULL</text>
<!-- Legend -->
<text x="400" y="150" font-size="12" fill="#666" text-anchor="middle">每个节点包含: 数据域 | 指针域(指向下一个节点)</text>
<text x="400" y="170" font-size="12" fill="#999" text-anchor="middle">插入/删除 O(1)（已知位置） · 查找 O(n)</text>
</svg>