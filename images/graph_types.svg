<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
<rect width="800" height="450" fill="#ffffff" rx="8"/>

<text x="400" y="30" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">图的类型 (Graph Types)</text>
<!-- Directed graph -->
<text x="150" y="70" font-size="14" font-weight="bold" fill="#2196F3" text-anchor="middle">有向图 (Directed)</text>
<circle cx="80" cy="120" r="25" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
<text x="80" y="125" font-size="14" fill="#1565C0" text-anchor="middle" font-weight="bold">1</text>
<circle cx="220" cy="120" r="25" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
<text x="220" y="125" font-size="14" fill="#1565C0" text-anchor="middle" font-weight="bold">2</text>
<circle cx="150" cy="220" r="25" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
<text x="150" y="225" font-size="14" fill="#1565C0" text-anchor="middle" font-weight="bold">3</text>
<defs>
  <marker id="arrow4" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2196F3"/></marker>
</defs>
<line x1="105" y1="120" x2="195" y2="120" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow4)"/>
<line x1="195" y1="140" x2="170" y2="200" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow4)"/>
<line x1="160" y1="195" x2="100" y2="140" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow4)"/>

<!-- Undirected graph -->
<text x="430" y="70" font-size="14" font-weight="bold" fill="#4CAF50" text-anchor="middle">无向图 (Undirected)</text>
<circle cx="360" cy="120" r="25" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2"/>
<text x="360" y="125" font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="bold">1</text>
<circle cx="500" cy="120" r="25" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2"/>
<text x="500" y="125" font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="bold">2</text>
<circle cx="430" cy="220" r="25" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2"/>
<text x="430" y="225" font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="bold">3</text>
<line x1="385" y1="120" x2="475" y2="120" stroke="#4CAF50" stroke-width="2"/>
<line x1="475" y1="140" x2="450" y2="200" stroke="#4CAF50" stroke-width="2"/>
<line x1="450" y1="195" x2="380" y2="140" stroke="#4CAF50" stroke-width="2"/>

<!-- Weighted graph -->
<text x="250" y="300" font-size="14" font-weight="bold" fill="#9C27B0" text-anchor="middle">带权图 (Weighted)</text>
<circle cx="180" cy="350" r="25" fill="#f3e5f5" stroke="#9C27B0" stroke-width="2"/>
<text x="180" y="355" font-size="14" fill="#6A1B9A" text-anchor="middle" font-weight="bold">A</text>
<circle cx="320" cy="350" r="25" fill="#f3e5f5" stroke="#9C27B0" stroke-width="2"/>
<text x="320" y="355" font-size="14" fill="#6A1B9A" text-anchor="middle" font-weight="bold">B</text>
<circle cx="250" cy="430" r="25" fill="#f3e5f5" stroke="#9C27B0" stroke-width="2"/>
<text x="250" y="435" font-size="14" fill="#6A1B9A" text-anchor="middle" font-weight="bold">C</text>
<line x1="205" y1="350" x2="295" y2="350" stroke="#9C27B0" stroke-width="2"/>
<text x="250" y="340" font-size="12" fill="#9C27B0" text-anchor="middle">w=5</text>
<line x1="295" y1="370" x2="270" y2="410" stroke="#9C27B0" stroke-width="2"/>
<text x="295" y="395" font-size="12" fill="#9C27B0" text-anchor="start">w=3</text>
<line x1="270" y1="410" x2="205" y2="370" stroke="#9C27B0" stroke-width="2"/>
<text x="230" y="400" font-size="12" fill="#9C27B0" text-anchor="end">w=2</text>

<!-- Adjacency list example -->
<text x="600" y="300" font-size="14" font-weight="bold" fill="#FF9800" text-anchor="middle">邻接表表示</text>
<rect x="520" y="320" width="200" height="30" rx="3" fill="#fff3e0" stroke="#FF9800" stroke-width="1"/>
<text x="530" y="340" font-size="12" fill="#E65100" font-weight="bold">A →</text><text x="560" y="340" font-size="12" fill="#666">B(5) → C(2)</text>
<rect x="520" y="355" width="200" height="30" rx="3" fill="#fff3e0" stroke="#FF9800" stroke-width="1"/>
<text x="530" y="375" font-size="12" fill="#E65100" font-weight="bold">B →</text><text x="560" y="375" font-size="12" fill="#666">A(5) → C(3)</text>
<rect x="520" y="390" width="200" height="30" rx="3" fill="#fff3e0" stroke="#FF9800" stroke-width="1"/>
<text x="530" y="410" font-size="12" fill="#E65100" font-weight="bold">C →</text><text x="560" y="410" font-size="12" fill="#666">A(2) → B(3)</text>
</svg>